name: Feature request
description: An idea for HQ, a new role, a team template or a pane improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The behaviour you would like. Sketches of the pane or example org.json snippets are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pane / status row, Engine / runs, Roles and agents, Team templates, Usage and cost, Obsidian, Docs]
